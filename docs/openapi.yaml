        rol_etiqueta: { type: string }
        profesional_id: { type: [integer, 'null'] }
    Profesional:
      type: object
      properties: { id: { type: integer }, nombre: { type: string }, titulo: { type: string }, especialidad_slug: { type: string }, especialidad: { type: string }, socia: { type: integer }, box_slug: { type: string }, activo: { type: integer } }
    Box:
