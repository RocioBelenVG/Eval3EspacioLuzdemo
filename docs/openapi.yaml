        fecha: { type: string, format: date }
        hora: { type: string, pattern: '^([01]\d|2[0-3]):(00|30)$' }
        duracion_min: { type: integer, minimum: 15, maximum: 480, default: 60 }
        tipo_atencion: { type: [string, 'null'], enum: [evaluacion, intervencion, orientacion_familiar, etapas_vida, otro, null] }
        precio_clp: { type: [integer, 'null'], minimum: 0, maximum: 5000000 }
        estado: { type: string, enum: [pendiente, confirmada], default: pendiente }
        notas: { type: [string, 'null'], maxLength: 500 }
    Atencion:
      type: object
      properties:
        id: { type: integer }
        publico_id: { type: string }
        fecha: { type: string, format: date }
        hora: { type: string, examples: ['10:00'] }
        duracion_min: { type: integer }
        estado: { $ref: '#/components/schemas/EstadoAtencion' }
        uso: { type: string, enum: [sesion, arriendo] }
        tipo_atencion: { type: [string, 'null'] }
        precio_clp: { type: integer }
        box_slug: { type: string }
        box: { type: string }
        profesional_id: { type: integer }
        profesional: { type: string }
        especialidad: { type: string }
        paciente_id: { type: [integer, 'null'] }
        paciente: { type: [string, 'null'] }
        cobrada: { type: integer }
        transiciones: { type: array, items: { $ref: '#/components/schemas/EstadoAtencion' } }
        movimientos: { type: array, items: { type: object } }
    PaginaAtenciones:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Atencion' } }
