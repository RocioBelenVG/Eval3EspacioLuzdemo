; Límites de subida para los archivos del panel (sobre todo el video de "Quiénes
; somos", que puede pesar varios MB). Se usa .user.ini (no .htaccess php_value)
; para no provocar un error 500 si el hosting corre PHP como FPM/CGI.
; Si el hosting no respeta este archivo, sube estos valores en el panel de PHP.
upload_max_filesize = 80M
post_max_size = 82M
max_execution_time = 120
