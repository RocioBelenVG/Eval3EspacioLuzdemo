# Espacio Luz Demo · nginx delante de PHP-FPM (servicio «app»).
# Replica las reglas del .htaccess del hosting: controlador frontal único (index.php),
# código interno y secretos nunca servidos, y recursos estáticos con caché.
server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.php;
    server_tokens off;
    client_max_body_size 82m;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Salud del propio nginx (la salud completa, con base de datos, es /api/v1/health)
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Código, dependencias, datos y archivos ocultos: nunca se sirven
    location ~ ^/(vendor|src|tests|database|docker|tools|storage|lib|pages|partials|dte|cron|content|docs)/ { return 404; }
    location ~ ^/api/.*\.php$ { return 404; }
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.(sql|md|lock|dist|sh|ini|log|bak|yaml|yml)$ { return 404; }
    location ~ ^/(config|data|phinx)\.php$ { return 404; }
    location = /assets/map-style.json { try_files $uri =404; }
    location ~* \.json$ { return 404; }

    # Recursos estáticos del front end (los sirve nginx directamente)
    location ^~ /assets/js/ { try_files $uri =404; add_header Cache-Control "no-cache"; access_log off; }
    location ^~ /assets/css/ { try_files $uri =404; add_header Cache-Control "no-cache"; access_log off; }
    location ^~ /assets/ { try_files $uri =404; expires 7d; access_log off; }

    # Todo lo demás (sitio, panel, API REST /api/v1, Swagger) entra por el controlador frontal
    location / { try_files $uri @app; }
    location @app {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 90s;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass app:9000;
    }
}
